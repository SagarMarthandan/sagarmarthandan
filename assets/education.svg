<svg viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Education — CAU Kiel, NIT Karnataka, additional">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: "Source Code Pro", "Google Sans Code", "MesloLGS NF", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s} .a7{animation-delay:.95s} .a8{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --ghost: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ink: #000000; --paper: #FFFFFF; }
  </style>

  <line x1="120" y1="10" x2="120" y2="270" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42" font-size="12" fill="var(--accent)" letter-spacing="2">ONGOING</text>
    <text class="mono" x="136" y="42" font-size="15" fill="var(--bone)">M.Sc. Quantitative Economics · Christian-Albrecht-University of Kiel</text>
    <text class="mono" x="136" y="64" font-size="14" fill="var(--muted)">Germany</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="108" font-size="12" fill="var(--accent)" letter-spacing="2">2023</text>
    <text class="mono" x="136" y="108" font-size="15" fill="var(--bone)">M.Sc. Computer Science · Christian-Albrecht-University of Kiel</text>
    <text class="mono" x="136" y="130" font-size="14" fill="var(--muted)">Completed November 2023 · Germany</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="174" font-size="12" fill="var(--accent)" letter-spacing="2">2014</text>
    <text class="mono" x="136" y="174" font-size="15" fill="var(--bone)">B.Tech Information Technology · NIT Karnataka, India</text>
    <text class="mono" x="136" y="196" font-size="14" fill="var(--muted)">Completed May 2014</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="240" font-size="12" fill="var(--accent)" letter-spacing="2">EXTRA</text>
    <text class="mono" x="136" y="240" font-size="14" fill="var(--bone)">English (Native) · German (B1 — planning B2) · ITIL v3 Foundations · SCRUM · Agile</text>
  </g>
</svg>