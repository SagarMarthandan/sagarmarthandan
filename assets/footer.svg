<svg viewBox="0 0 1000 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: open to work. Kiel, Germany. SagarMarthandan">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: "Source Code Pro", "Google Sans Code", "MesloLGS NF", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --ghost: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ink: #000000; --paper: #FFFFFF; }
  </style>
  <line class="draw" x1="48" y1="24" x2="952" y2="24"/>
  <circle class="ring" cx="60" cy="64" r="5" stroke="var(--accent)" stroke-width="1" fill="none"/>
  <circle class="dot" cx="60" cy="64" r="4" fill="var(--accent)"/>
  <text class="mono" x="82" y="62" font-size="12" letter-spacing="3" fill="var(--bone)">STATUS — OPEN TO WORK</text>
  <text class="mono" x="82" y="82" font-size="11" letter-spacing="2" fill="var(--muted)">building data platforms, probably pipelines deep</text>
  <text class="mono" x="952" y="66" font-size="15" text-anchor="end" fill="var(--muted)">SagarMarthandan  ·  Kiel, DE  ·  © 2026</text>
  <text class="mono" x="500" y="108" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="var(--muted)" opacity=".55">inspired by Sharann-del</text>
</svg>