<svg viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sagar Marthandan — Data Engineer &amp; Analytics Engineer">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #FFFFFF; --muted: #FFFFFF; --dim: #FFFFFF; --rule: #FFFFFF; --accent: #FFFFFF; --ghost: #FFFFFF; --node-bg: #000000; --core-bg: #000000; --ink: #FFFFFF; --paper: #000000; }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">KIEL, DE — 54.32° N</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="176" font-size="72" letter-spacing="-2">Sagar Marthandan</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="214" font-size="19">Data Engineer · Analytics Engineer — Kiel, Germany.</text>
  </g>
</svg>