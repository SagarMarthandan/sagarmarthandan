<svg viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, education">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: "Source Code Pro", "Google Sans Code", "MesloLGS NF", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s} .a7{animation-delay:.95s} .a8{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #FFFFFF; --muted: #FFFFFF; --dim: #FFFFFF; --rule: #FFFFFF; --accent: #FFFFFF; --ghost: #FFFFFF; --node-bg: #000000; --core-bg: #000000; --ink: #FFFFFF; --paper: #000000; }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--bone)">I build end-to-end data platforms — from raw ingestion to production-grade BI dashboards.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--bone)">ELT pipelines (dbt, Airflow, Airbyte, Dagster) · cloud warehousing (Snowflake, BigQuery, Databricks)</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="var(--muted)">dimensional modeling and SCD Type 2 · streaming (Kafka, Redis) · AI/LLM tooling (RAG, LangChain, FAISS)</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="var(--bone)">Data Engineering · Analytics Engineering · Modern Data Stack · AI/LLM Tooling</text>

  <text class="mono rise a5" x="48"  y="182" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="var(--accent)">open to working-student · intern · entry-level roles in Germany</text>

  <text class="mono rise a6" x="48"  y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">BASED</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="var(--bone)">Kiel, Germany · M.Sc. Quantitative Economics (ongoing) · M.Sc. CS (2023)</text>
</svg>