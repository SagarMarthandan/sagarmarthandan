<svg viewBox="0 0 1000 272" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, engineering, processing, warehousing, cloud, quality, visualization, AI">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: "Source Code Pro", "Google Sans Code", "MesloLGS NF", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s} .a8{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --ghost: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ink: #000000; --paper: #FFFFFF; }
  </style>

  <line x1="215" y1="8" x2="215" y2="264" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <text class="mono rise a1" x="48" y="32" font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="240" y="32" font-size="15" fill="var(--bone)">Python · SQL · PySpark · DAX / Power Query · Jinja · Java · Haskell</text>
  <text class="mono rise a2" x="48" y="64" font-size="12" fill="var(--muted)" letter-spacing="2">ENGINEERING</text>
  <text class="mono rise a2" x="240" y="64" font-size="15" fill="var(--bone)">dbt · Airflow · Airbyte · Dagster · Kafka · Redis · Docker · Spark</text>
  <text class="mono rise a3" x="48" y="96" font-size="12" fill="var(--muted)" letter-spacing="2">PROCESSING</text>
  <text class="mono rise a3" x="240" y="96" font-size="15" fill="var(--bone)">Pandas · NumPy · Jupyter · Spark SQL · PySpark</text>
  <text class="mono rise a4" x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">WAREHOUSING</text>
  <text class="mono rise a4" x="240" y="128" font-size="15" fill="var(--bone)">Snowflake · BigQuery · Azure Databricks · Delta Lake · AWS S3</text>
  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">CLOUD / IaC</text>
  <text class="mono rise a5" x="240" y="160" font-size="15" fill="var(--bone)">GCP · Azure · AWS · Terraform · Data Factory · Fabric</text>
  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">QUALITY / CI</text>
  <text class="mono rise a6" x="240" y="192" font-size="15" fill="var(--bone)">GitHub Actions · GitLab CI · Git · pytest · Soda Core · Linux</text>
  <text class="mono rise a7" x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">VISUALIZATION</text>
  <text class="mono rise a7" x="240" y="224" font-size="15" fill="var(--bone)">Power BI · Superset · Looker Studio · Tableau · Plotly · Streamlit</text>
  <text class="mono rise a8" x="48" y="256" font-size="12" fill="var(--muted)" letter-spacing="2">AI / LLM</text>
  <text class="mono rise a8" x="240" y="256" font-size="15" fill="var(--bone)">LangChain · LangGraph · scikit-learn · FAISS · RAG · Sentence-Transformers</text>
</svg>