<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 03 — PROJECTS">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; --ghost: #CCCCCC; --node-bg: #F0F0F0; --core-bg: #E8E8E8; --ink: #000000; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; --ghost: #2A2A2A; --node-bg: #1A1A1A; --core-bg: #222222; --ink: #FFFFFF; --paper: #000000; } }
    .mono { font-family: "Source Code Pro", "Google Sans Code", "MesloLGS NF", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pop,.grow,.tick,.ring,.dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise,.fade,.pop,.grow { opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
    :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --ghost: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ink: #000000; --paper: #FFFFFF; }
  </style>
  <g class="f">
    <text class="mono" x="48" y="68" font-size="52" fill="var(--ghost)">03</text>
    <text class="mono" x="128" y="58" font-size="14" fill="var(--accent)" letter-spacing="6">PROJECTS</text>
    <text class="mono" x="952" y="58" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/projects</text>
  </g>
  <line class="draw" x1="248" y1="53" x2="790" y2="53"/>
</svg>